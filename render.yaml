services:
  - type: web
    name: shinex-marketplace
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://shinexmarket.onrender.com
      - key: ADMIN_FRONTEND_URL
        value: https://shinex-admin.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://shinexmarket.onrender.com,https://shinex-admin.onrender.com
      - key: CONTACT_EMAIL
        value: shinexlearning@gmail.com
      - key: CONTACT_PHONE
        value: +234 706 757 4479
      - key: CONTACT_WHATSAPP
        value: +234 802 505 2852
      - key: CONTACT_ADDRESS
        sync: false
      - key: RESET_URL_BASE
        value: https://shinexmarket.onrender.com/reset-password
